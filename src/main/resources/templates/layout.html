<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} ?: 'Research Hub'">Research Hub</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f7fa; color: #333; }
        .navbar { background: #1a237e; color: white; padding: 0 2rem; display: flex; align-items: center; height: 60px; box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
        .navbar-brand { font-size: 1.4rem; font-weight: 700; text-decoration: none; color: white; margin-right: 2rem; }
        .navbar-nav { display: flex; list-style: none; gap: 0.5rem; }
        .navbar-nav a { color: rgba(255,255,255,0.85); text-decoration: none; padding: 0.5rem 1rem; border-radius: 6px; transition: all 0.2s; font-size: 0.9rem; }
        .navbar-nav a:hover, .navbar-nav a.active { color: white; background: rgba(255,255,255,0.15); }
        .navbar-right { margin-left: auto; display: flex; align-items: center; gap: 1rem; }
        .navbar-right span { font-size: 0.85rem; opacity: 0.8; }
        .navbar-right a { color: rgba(255,255,255,0.85); text-decoration: none; font-size: 0.85rem; }
        .navbar-right a:hover { color: white; }
        .container { max-width: 1200px; margin: 2rem auto; padding: 0 2rem; }
        .card { background: white; border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); padding: 1.5rem; margin-bottom: 1.5rem; }
        .card-header { font-size: 1.2rem; font-weight: 600; margin-bottom: 1rem; padding-bottom: 0.75rem; border-bottom: 1px solid #eee; }
        .btn { display: inline-block; padding: 0.5rem 1.2rem; border-radius: 6px; text-decoration: none; font-size: 0.9rem; font-weight: 500; cursor: pointer; border: none; transition: all 0.2s; }
        .btn-primary { background: #1a237e; color: white; }
        .btn-primary:hover { background: #283593; }
        .btn-success { background: #2e7d32; color: white; }
        .btn-success:hover { background: #388e3c; }
        .btn-secondary { background: #757575; color: white; }
        .btn-secondary:hover { background: #616161; }
        .btn-sm { padding: 0.3rem 0.8rem; font-size: 0.8rem; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 0.75rem 1rem; text-align: left; border-bottom: 1px solid #eee; }
        th { background: #f8f9fa; font-weight: 600; font-size: 0.85rem; color: #666; text-transform: uppercase; }
        td { font-size: 0.9rem; }
        tr:hover { background: #f8f9fa; }
        .badge { display: inline-block; padding: 0.2rem 0.6rem; border-radius: 12px; font-size: 0.75rem; font-weight: 600; }
        .badge-draft { background: #fff3e0; color: #e65100; }
        .badge-submitted { background: #e3f2fd; color: #1565c0; }
        .badge-published { background: #e8f5e9; color: #2e7d32; }
        .badge-planned { background: #f3e5f5; color: #7b1fa2; }
        .badge-in_progress { background: #fff3e0; color: #e65100; }
        .badge-completed { background: #e8f5e9; color: #2e7d32; }
        .badge-failed { background: #ffebee; color: #c62828; }
        .badge-active { background: #e3f2fd; color: #1565c0; }
        .badge-archived { background: #f5f5f5; color: #616161; }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; margin-bottom: 0.3rem; font-weight: 500; font-size: 0.9rem; }
        .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 0.6rem; border: 1px solid #ddd; border-radius: 6px; font-size: 0.9rem; }
        .form-group textarea { min-height: 100px; resize: vertical; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; }
        .stat-card { background: white; border-radius: 10px; padding: 1.5rem; text-align: center; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
        .stat-card .stat-number { font-size: 2rem; font-weight: 700; color: #1a237e; }
        .stat-card .stat-label { font-size: 0.85rem; color: #888; margin-top: 0.3rem; }
        .detail-field { margin-bottom: 1rem; }
        .detail-field .field-label { font-weight: 600; color: #666; font-size: 0.85rem; margin-bottom: 0.3rem; }
        .detail-field .field-value { font-size: 0.95rem; }
        .login-container { display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .login-card { background: white; border-radius: 12px; padding: 2.5rem; box-shadow: 0 4px 20px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        .login-card h2 { text-align: center; margin-bottom: 1.5rem; color: #1a237e; }
        .alert { padding: 0.75rem 1rem; border-radius: 6px; margin-bottom: 1rem; font-size: 0.9rem; }
        .alert-error { background: #ffebee; color: #c62828; }
    </style>
</head>
<body>
    <nav class="navbar" sec:authorize="isAuthenticated()">
        <a class="navbar-brand" href="/dashboard">Research Hub</a>
        <ul class="navbar-nav">
            <li><a href="/dashboard">仪表盘</a></li>
            <li><a href="/papers">论文</a></li>
            <li><a href="/experiments">实验</a></li>
            <li><a href="/projects">项目</a></li>
            <li><a href="/teams">团队</a></li>
            <li><a href="/notes">笔记</a></li>
        </ul>
        <div class="navbar-right">
            <span sec:authentication="name">User</span>
            <a href="/logout">退出</a>
        </div>
    </nav>
    <div class="container" layout:fragment="content">
        <p>Default content</p>
    </div>
</body>
</html>
