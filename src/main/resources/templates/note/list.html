<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>笔记列表 - Research Hub</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f7fa; color: #333; }
        .navbar { background: #1a237e; color: white; padding: 0 2rem; display: flex; align-items: center; height: 60px; box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
        .navbar-brand { font-size: 1.4rem; font-weight: 700; text-decoration: none; color: white; margin-right: 2rem; }
        .navbar-nav { display: flex; list-style: none; gap: 0.5rem; }
        .navbar-nav a { color: rgba(255,255,255,0.85); text-decoration: none; padding: 0.5rem 1rem; border-radius: 6px; font-size: 0.9rem; }
        .navbar-nav a:hover, .navbar-nav a.active { color: white; background: rgba(255,255,255,0.15); }
        .navbar-right { margin-left: auto; display: flex; align-items: center; gap: 1rem; }
        .navbar-right span { font-size: 0.85rem; opacity: 0.8; }
        .navbar-right a { color: rgba(255,255,255,0.85); text-decoration: none; font-size: 0.85rem; }
        .container { max-width: 1200px; margin: 2rem auto; padding: 0 2rem; }
        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
        .page-title { font-size: 1.5rem; font-weight: 700; color: #1a237e; }
        .btn { display: inline-block; padding: 0.5rem 1.2rem; border-radius: 6px; text-decoration: none; font-size: 0.9rem; font-weight: 500; cursor: pointer; border: none; }
        .btn-primary { background: #1a237e; color: white; }
        .btn-primary:hover { background: #283593; }
        .notes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 1rem; }
        .note-card { background: white; border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); padding: 1.5rem; }
        .note-card h3 { font-size: 1.1rem; margin-bottom: 0.5rem; color: #1a237e; }
        .note-card p { font-size: 0.9rem; color: #555; line-height: 1.5; margin-bottom: 0.75rem; }
        .note-card .meta { font-size: 0.8rem; color: #999; }
    </style>
</head>
<body>
    <nav class="navbar">
        <a class="navbar-brand" href="/dashboard">Research Hub</a>
        <ul class="navbar-nav">
            <li><a href="/dashboard">仪表盘</a></li>
            <li><a href="/papers">论文</a></li>
            <li><a href="/experiments">实验</a></li>
            <li><a href="/projects">项目</a></li>
            <li><a href="/teams">团队</a></li>
            <li><a href="/notes" class="active">笔记</a></li>
        </ul>
        <div class="navbar-right">
            <span sec:authentication="name">User</span>
            <a href="/logout">退出</a>
        </div>
    </nav>
    <div class="container">
        <div class="page-header">
            <h1 class="page-title">笔记列表</h1>
            <a href="/notes/create" class="btn btn-primary">+ 新建笔记</a>
        </div>
        <div class="notes-grid">
            <div class="note-card" th:each="note : ${notes}">
                <h3 th:text="${note.title}">Note Title</h3>
                <p th:text="${#strings.abbreviate(note.content, 150)}">Content preview...</p>
                <div class="meta">
                    <span>项目ID: <span th:text="${note.projectId} ?: '无'">-</span></span> |
                    <span th:text="${#temporals.format(note.createdAt, 'yyyy-MM-dd')}">Date</span>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
