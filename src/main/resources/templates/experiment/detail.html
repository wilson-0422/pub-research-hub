<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>实验详情 - Research Hub</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f7fa; color: #333; }
        .navbar { background: #1a237e; color: white; padding: 0 2rem; display: flex; align-items: center; height: 60px; box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
        .navbar-brand { font-size: 1.4rem; font-weight: 700; text-decoration: none; color: white; margin-right: 2rem; }
        .navbar-nav { display: flex; list-style: none; gap: 0.5rem; }
        .navbar-nav a { color: rgba(255,255,255,0.85); text-decoration: none; padding: 0.5rem 1rem; border-radius: 6px; font-size: 0.9rem; }
        .navbar-nav a:hover, .navbar-nav a.active { color: white; background: rgba(255,255,255,0.15); }
        .navbar-right { margin-left: auto; display: flex; align-items: center; gap: 1rem; }
        .navbar-right span { font-size: 0.85rem; opacity: 0.8; }
        .navbar-right a { color: rgba(255,255,255,0.85); text-decoration: none; font-size: 0.85rem; }
        .container { max-width: 1200px; margin: 2rem auto; padding: 0 2rem; }
        .page-title { font-size: 1.5rem; font-weight: 700; color: #1a237e; margin-bottom: 1.5rem; }
        .card { background: white; border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); padding: 1.5rem; margin-bottom: 1.5rem; }
        .detail-field { margin-bottom: 1rem; }
        .detail-field .field-label { font-weight: 600; color: #666; font-size: 0.85rem; margin-bottom: 0.3rem; }
        .detail-field .field-value { font-size: 0.95rem; line-height: 1.6; }
        .badge { display: inline-block; padding: 0.2rem 0.6rem; border-radius: 12px; font-size: 0.75rem; font-weight: 600; }
        .badge-planned { background: #f3e5f5; color: #7b1fa2; }
        .badge-in_progress { background: #fff3e0; color: #e65100; }
        .badge-completed { background: #e8f5e9; color: #2e7d32; }
        .badge-failed { background: #ffebee; color: #c62828; }
        .btn { display: inline-block; padding: 0.5rem 1.2rem; border-radius: 6px; text-decoration: none; font-size: 0.9rem; font-weight: 500; cursor: pointer; border: none; }
        .btn-secondary { background: #757575; color: white; }
    </style>
</head>
<body>
    <nav class="navbar">
        <a class="navbar-brand" href="/dashboard">Research Hub</a>
        <ul class="navbar-nav">
            <li><a href="/dashboard">仪表盘</a></li>
            <li><a href="/papers">论文</a></li>
            <li><a href="/experiments" class="active">实验</a></li>
            <li><a href="/projects">项目</a></li>
            <li><a href="/teams">团队</a></li>
            <li><a href="/notes">笔记</a></li>
        </ul>
        <div class="navbar-right">
            <span sec:authentication="name">User</span>
            <a href="/logout">退出</a>
        </div>
    </nav>
    <div class="container">
        <h1 class="page-title" th:text="${experiment.title}">Experiment Title</h1>
        <div class="card">
            <div class="detail-field">
                <div class="field-label">状态</div>
                <div class="field-value"><span class="badge" th:classappend="'badge-' + ${#strings.replace(experiment.status.name(), '_', '').toLowerCase()}" th:text="${experiment.status}">PLANNED</span></div>
            </div>
            <div class="detail-field">
                <div class="field-label">描述</div>
                <div class="field-value" th:text="${experiment.description}">Description</div>
            </div>
            <div class="detail-field">
                <div class="field-label">假设</div>
                <div class="field-value" th:text="${experiment.hypothesis} ?: '-'">Hypothesis</div>
            </div>
            <div class="detail-field">
                <div class="field-label">方法</div>
                <div class="field-value" th:text="${experiment.methodology} ?: '-'">Methodology</div>
            </div>
            <div class="detail-field">
                <div class="field-label">结果</div>
                <div class="field-value" th:text="${experiment.results} ?: '-'">Results</div>
            </div>
            <div class="detail-field">
                <div class="field-label">结论</div>
                <div class="field-value" th:text="${experiment.conclusion} ?: '-'">Conclusion</div>
            </div>
            <div class="detail-field">
                <div class="field-label">创建时间</div>
                <div class="field-value" th:text="${#temporals.format(experiment.createdAt, 'yyyy-MM-dd HH:mm')}">Created</div>
            </div>
            <div class="detail-field">
                <div class="field-label">更新时间</div>
                <div class="field-value" th:text="${experiment.updatedAt} ? ${#temporals.format(experiment.updatedAt, 'yyyy-MM-dd HH:mm')} : '-'">Updated</div>
            </div>
        </div>
        <a href="/experiments" class="btn btn-secondary">返回列表</a>
    </div>
</body>
</html>
