<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>项目列表 - Research Hub</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f7fa; color: #333; }
        .navbar { background: #1a237e; color: white; padding: 0 2rem; display: flex; align-items: center; height: 60px; box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
        .navbar-brand { font-size: 1.4rem; font-weight: 700; text-decoration: none; color: white; margin-right: 2rem; }
        .navbar-nav { display: flex; list-style: none; gap: 0.5rem; }
        .navbar-nav a { color: rgba(255,255,255,0.85); text-decoration: none; padding: 0.5rem 1rem; border-radius: 6px; font-size: 0.9rem; }
        .navbar-nav a:hover, .navbar-nav a.active { color: white; background: rgba(255,255,255,0.15); }
        .navbar-right { margin-left: auto; display: flex; align-items: center; gap: 1rem; }
        .navbar-right span { font-size: 0.85rem; opacity: 0.8; }
        .navbar-right a { color: rgba(255,255,255,0.85); text-decoration: none; font-size: 0.85rem; }
        .container { max-width: 1200px; margin: 2rem auto; padding: 0 2rem; }
        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
        .page-title { font-size: 1.5rem; font-weight: 700; color: #1a237e; }
        .btn { display: inline-block; padding: 0.5rem 1.2rem; border-radius: 6px; text-decoration: none; font-size: 0.9rem; font-weight: 500; cursor: pointer; border: none; }
        .btn-primary { background: #1a237e; color: white; }
        .btn-primary:hover { background: #283593; }
        .card { background: white; border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); padding: 1.5rem; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 0.75rem 1rem; text-align: left; border-bottom: 1px solid #eee; }
        th { background: #f8f9fa; font-weight: 600; font-size: 0.85rem; color: #666; text-transform: uppercase; }
        td { font-size: 0.9rem; }
        tr:hover { background: #f8f9fa; }
        .badge { display: inline-block; padding: 0.2rem 0.6rem; border-radius: 12px; font-size: 0.75rem; font-weight: 600; }
        .badge-active { background: #e3f2fd; color: #1565c0; }
        .badge-completed { background: #e8f5e9; color: #2e7d32; }
        .badge-archived { background: #f5f5f5; color: #616161; }
        a { color: #1a237e; text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <nav class="navbar">
        <a class="navbar-brand" href="/dashboard">Research Hub</a>
        <ul class="navbar-nav">
            <li><a href="/dashboard">仪表盘</a></li>
            <li><a href="/papers">论文</a></li>
            <li><a href="/experiments">实验</a></li>
            <li><a href="/projects" class="active">项目</a></li>
            <li><a href="/teams">团队</a></li>
            <li><a href="/notes">笔记</a></li>
        </ul>
        <div class="navbar-right">
            <span sec:authentication="name">User</span>
            <a href="/logout">退出</a>
        </div>
    </nav>
    <div class="container">
        <div class="page-header">
            <h1 class="page-title">项目列表</h1>
            <a href="/projects/create" class="btn btn-primary">+ 新建项目</a>
        </div>
        <div class="card">
            <table>
                <thead>
                    <tr>
                        <th>名称</th>
                        <th>描述</th>
                        <th>状态</th>
                        <th>开始日期</th>
                        <th>结束日期</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="project : ${projects}">
                        <td><a th:href="@{/projects/{id}(id=${project.id})}" th:text="${project.name}">Name</a></td>
                        <td th:text="${project.description} != null ? ${#strings.abbreviate(project.description, 50)} : '-'">Description</td>
                        <td><span class="badge" th:classappend="'badge-' + ${#strings.replace(project.status.name(), '_', '').toLowerCase()}" th:text="${project.status}">ACTIVE</span></td>
                        <td th:text="${project.startDate} ? ${#temporals.format(project.startDate, 'yyyy-MM-dd')} : '-'">Start</td>
                        <td th:text="${project.endDate} ? ${#temporals.format(project.endDate, 'yyyy-MM-dd')} : '-'">End</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
