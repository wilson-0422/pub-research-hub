<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新建实验 - Research Hub</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f7fa; color: #333; }
        .navbar { background: #1a237e; color: white; padding: 0 2rem; display: flex; align-items: center; height: 60px; box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
        .navbar-brand { font-size: 1.4rem; font-weight: 700; text-decoration: none; color: white; margin-right: 2rem; }
        .navbar-nav { display: flex; list-style: none; gap: 0.5rem; }
        .navbar-nav a { color: rgba(255,255,255,0.85); text-decoration: none; padding: 0.5rem 1rem; border-radius: 6px; font-size: 0.9rem; }
        .navbar-nav a:hover, .navbar-nav a.active { color: white; background: rgba(255,255,255,0.15); }
        .navbar-right { margin-left: auto; display: flex; align-items: center; gap: 1rem; }
        .navbar-right span { font-size: 0.85rem; opacity: 0.8; }
        .navbar-right a { color: rgba(255,255,255,0.85); text-decoration: none; font-size: 0.85rem; }
        .container { max-width: 800px; margin: 2rem auto; padding: 0 2rem; }
        .page-title { font-size: 1.5rem; font-weight: 700; color: #1a237e; margin-bottom: 1.5rem; }
        .card { background: white; border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); padding: 1.5rem; }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; margin-bottom: 0.3rem; font-weight: 500; font-size: 0.9rem; }
        .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 0.6rem; border: 1px solid #ddd; border-radius: 6px; font-size: 0.9rem; }
        .form-group textarea { min-height: 100px; resize: vertical; }
        .btn { display: inline-block; padding: 0.5rem 1.2rem; border-radius: 6px; text-decoration: none; font-size: 0.9rem; font-weight: 500; cursor: pointer; border: none; }
        .btn-primary { background: #1a237e; color: white; }
        .btn-primary:hover { background: #283593; }
        .btn-secondary { background: #757575; color: white; }
        .btn-group { display: flex; gap: 0.5rem; margin-top: 1rem; }
    </style>
</head>
<body>
    <nav class="navbar">
        <a class="navbar-brand" href="/dashboard">Research Hub</a>
        <ul class="navbar-nav">
            <li><a href="/dashboard">仪表盘</a></li>
            <li><a href="/papers">论文</a></li>
            <li><a href="/experiments" class="active">实验</a></li>
            <li><a href="/projects">项目</a></li>
            <li><a href="/teams">团队</a></li>
            <li><a href="/notes">笔记</a></li>
        </ul>
        <div class="navbar-right">
            <span sec:authentication="name">User</span>
            <a href="/logout">退出</a>
        </div>
    </nav>
    <div class="container">
        <h1 class="page-title">新建实验</h1>
        <div class="card">
            <form th:action="@{/experiments/create}" th:object="${experimentDTO}" method="post">
                <div class="form-group">
                    <label>标题</label>
                    <input type="text" th:field="*{title}" required>
                </div>
                <div class="form-group">
                    <label>描述</label>
                    <textarea th:field="*{description}"></textarea>
                </div>
                <div class="form-group">
                    <label>假设</label>
                    <textarea th:field="*{hypothesis}"></textarea>
                </div>
                <div class="form-group">
                    <label>方法</label>
                    <textarea th:field="*{methodology}"></textarea>
                </div>
                <div class="form-group">
                    <label>结果</label>
                    <textarea th:field="*{results}"></textarea>
                </div>
                <div class="form-group">
                    <label>结论</label>
                    <textarea th:field="*{conclusion}"></textarea>
                </div>
                <div class="form-group">
                    <label>状态</label>
                    <select th:field="*{status}">
                        <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}">PLANNED</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>项目ID</label>
                    <input type="number" th:field="*{projectId}">
                </div>
                <div class="btn-group">
                    <button type="submit" class="btn btn-primary">创建</button>
                    <a href="/experiments" class="btn btn-secondary">取消</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
