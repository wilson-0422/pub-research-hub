<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - Research Hub</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f7fa; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .login-card { background: white; border-radius: 12px; padding: 2.5rem; box-shadow: 0 4px 20px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        .login-card h2 { text-align: center; margin-bottom: 0.5rem; color: #1a237e; font-size: 1.6rem; }
        .login-card .subtitle { text-align: center; color: #888; margin-bottom: 1.5rem; font-size: 0.9rem; }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; margin-bottom: 0.3rem; font-weight: 500; font-size: 0.9rem; }
        .form-group input { width: 100%; padding: 0.6rem; border: 1px solid #ddd; border-radius: 6px; font-size: 0.9rem; }
        .btn { display: block; width: 100%; padding: 0.7rem; background: #1a237e; color: white; border: none; border-radius: 6px; font-size: 1rem; font-weight: 600; cursor: pointer; margin-top: 0.5rem; }
        .btn:hover { background: #283593; }
        .alert { padding: 0.75rem 1rem; border-radius: 6px; margin-bottom: 1rem; font-size: 0.9rem; background: #ffebee; color: #c62828; }
        .hint { margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid #eee; font-size: 0.8rem; color: #999; }
        .hint p { margin-bottom: 0.3rem; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>Research Hub</h2>
        <p class="subtitle">研究协作平台</p>
        <div th:if="${param.error}">
            <div class="alert">用户名或密码错误</div>
        </div>
        <div th:if="${param.logout}">
            <div class="alert" style="background:#e8f5e9;color:#2e7d32;">已成功退出</div>
        </div>
        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label>用户名</label>
                <input type="text" name="username" required autofocus>
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" name="password" required>
            </div>
            <button type="submit" class="btn">登录</button>
        </form>
        <div class="hint">
            <p>测试账号：</p>
            <p>admin / admin123</p>
            <p>researcher1 / research123</p>
            <p>leader1 / leader123</p>
        </div>
    </div>
</body>
</html>
