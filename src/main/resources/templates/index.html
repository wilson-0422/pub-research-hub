<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Research Hub - 首页</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #1a237e 0%, #283593 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; }
        .hero { text-align: center; color: white; }
        .hero h1 { font-size: 3rem; margin-bottom: 1rem; }
        .hero p { font-size: 1.2rem; opacity: 0.85; margin-bottom: 2rem; }
        .hero a { display: inline-block; padding: 0.8rem 2rem; background: white; color: #1a237e; border-radius: 8px; text-decoration: none; font-weight: 600; font-size: 1rem; transition: transform 0.2s; }
        .hero a:hover { transform: translateY(-2px); }
    </style>
</head>
<body>
    <div class="hero">
        <h1>Research Hub</h1>
        <p>研究协作平台 — 论文管理 · 实验记录 · 团队协作</p>
        <a href="/login">登录系统</a>
    </div>
</body>
</html>
